name: Upload File to S3

on:
  workflow_dispatch:
    inputs:
      aws_account:
        description: 'Choose AWS account'
        required: true
        type: choice
        options:
          - 'SBOX-CIM'
          - 'DEV-CIM'

jobs:
  upload-to-s3:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write  # Required for OIDC authentication
      contents: read   # Default permission for actions/checkout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download File
        run: |
          curl -o file1 "https://raw.githubusercontent.com/github/gitignore/main/Node.gitignore"
          curl -o file2 "https://raw.githubusercontent.com/github/gitignore/main/Python.gitignore"
          curl -o file3 "https://raw.githubusercontent.com/github/gitignore/main/Java.gitignore"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::034362044754:role/test-s3-neha
          aws-region: ap-southeast-1

      - name: Set AWS account number and corresponding bucket name
        run: |
          declare -A account_map
          account_map["SBOX-CIM"]="12345"
          account_map["DEV-CIM"]="67890"
          
          AWS_ACCOUNT_NUMBER=${account_map["${{ github.event.inputs.aws_account }}"]}          
          echo "Using account $AWS_ACCOUNT_NUMBER"
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

          BUCKET_NAME=$AWS_ACCOUNT_NUMBER-cim-nexus-jar
          echo "Using bucket $BUCKET_NAME"
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

      - name: Upload to S3
        run: |
          aws s3 cp file1 s3://test-nexus-neha/nexus-jars/Node.gitignore
          aws s3 cp file2 s3://test-nexus-neha/nexus-jars/Python.gitignore
          aws s3 cp file3 s3://test-nexus-neha/nexus-jars/Java.gitignore
      - name: List files in S3 bucket
        run: |
           echo "Listing files in S3 bucket ${{ env.BUCKET_NAME }}"
           aws s3 ls s3://test-nexus-neha/ --recursive
