name: Upload File to S3

on:
  workflow_dispatch:
    inputs:
      s3_bucket:
        description: 'test-nexus-neha'
        required: true
      s3_key:
        description: 'nexus-jars/'
        required: true

jobs:
  upload-to-s3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download File
        run: |
          curl -o file_to_upload "https://raw.githubusercontent.com/github/gitignore/main/Node.gitignore"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 cp file_to_upload s3://${{ github.event.inputs.s3_bucket }}/${{ github.event.inputs.s3_key }}
